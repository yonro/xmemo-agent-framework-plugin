[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmemo-agent-framework"
version = "0.2.0"
description = "Opt-in XMemo context and capture for Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
maf = ["agent-framework-core==1.21.0"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "mcp==1.30.0", "opentelemetry-sdk>=1.39,<2", "build", "twine"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "mcp==1.30.0", "opentelemetry-sdk>=1.39,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: explicit loopback lab test, excluded by default"]
addopts = "-m 'not integration'"
